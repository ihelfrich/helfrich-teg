[project]
name = "helfrich-teg"
version = "0.1.0"
description = "Topological Epidemic Geometry — multi-layer heterogeneous-spatial pandemic modelling"
authors = [{ name = "Ian T. Helfrich", email = "ianthelfrich@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "matplotlib>=3.8",
    "requests>=2.31",
    "certifi>=2023.7.22",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel", "ipywidgets"]
viz = ["folium", "contextily", "mapclassify"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
